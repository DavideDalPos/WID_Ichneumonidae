taxa_page:
  overview:
    panels:
      - - - panel:gallery
          - panel:type
          - panel:type-specimen
          - panel:nomenclature
          - panel:nomenclature-references

        - - panel:map-v2
        # - panel:map
          - panel:descendants
          - panel:scrutiny
          - panel:content
          - panel:keys
          - panel:etymology
          - panel:gbif
          - panel:statistics
          
      - - - panel:biological-associations-v2
  specimen_records:
    label: 'Specimen & Occurrence Records'
    # No rank_group restriction — experimentally enabled for every rank (see
    # PanelSpecimenOccurrences.vue's isHigherTaxon). Genus/subgenus is the
    # only range actually verified to perform reasonably; tribe and up are
    # untested/likely impractical (see project memory) but left open on
    # purpose to see how it actually behaves rather than pre-judging it.
    panels:
      - - - panel:specimen-occurrences
  asserted_distributions:
    label: 'Asserted Distributions'
    rank_group: ['SpeciesGroup']
    panels:
      - - - id: panel:asserted-distributions
  field_occurrences:
    rank_group: ['SpeciesGroup']
    panels:
      - - - panel:field-occurrences
  inaturalist:
    label: 'iNaturalist'
    panels:
      - - - id: panel:inaturalist

  GBIF:
    label: 'GBIF'
    # panel:gbif-taxon removed pending a redesign; the concept-alignment rebuild
    # shipped with known correctness bugs (see the 2026-08-31 GBIF spec).
    panels:
      - - - panel:gbif-images
          - panel:gbif-map
          - panel:gbif-type-specimens



